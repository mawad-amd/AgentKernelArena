prompt:
  source_code: null
  instructions: Optimize the Triton fused inverse GPT-J RoPE kernel
    _inverse_rope_gptj_kernel (in rocm_aiter_mla_sparse.py) on MI355X/gfx950. This
    runs on the DeepSeek-V4-Flash attention output projection path and is one of the
    highest-launch-count kernels in the model - 4,902 launches in a measured prefill
    and 11,008 in a 256-token decode. It copies the NoPE head region unchanged and
    applies the inverse rotation to the trailing rope_head_dim elements, reading a
    [P, rope_head_dim] cos|sin cache indexed by token position. The launch is one
    program per (token, head), so it is launch-bound at decode shapes and
    bandwidth-bound at prefill shapes; the two cases here cover both regimes.
    Preserve all correctness cases and improve CUDA-graph measured performance. Do
    not change the signature of _fused_inverse_rope_gptj.
  cheatsheet: null
