task_type: image_kernel
image_repo_path: /sgl-workspace/sglang/python/sglang
repo_subdir: sglang
repository_language: triton
source_file_path:
  - kernels/ops/attention/dsv4/unified_kv_kernels/paged_prefill.py
target_kernel_functions:
  - _sparse_attn_v4_paged_prefill_kernel
  - _sparse_attn_v4_paged_prefill_triton
kernel_identity:
  logical_operator: dsv4_paged_prefill
  kernel_kind: triton
  source_owner: sglang
  workload:
    source: session_cases.json
    primary_case: c4-prefill
compile_command:
  - python3 scripts/task_runner.py compile
correctness_command:
  - python3 scripts/task_runner.py correctness
performance_command:
  - python3 scripts/task_runner.py performance
compile_timeout: 1800
correctness_timeout: 1800
performance_timeout: 1800
task_result_template: null
prompt:
  source_code: null
  instructions: >-
    Optimize the SGLang DeepSeek-V4 unified-KV paged prefill attention on MI355X/gfx950:
    _sparse_attn_v4_paged_prefill_kernel and its launcher _sparse_attn_v4_paged_prefill_triton
    in kernels/ops/attention/dsv4/unified_kv_kernels/paged_prefill.py. This is the prefill
    attention SGLang runs under SGLANG_HACK_FLASHMLA_BACKEND=unified_kv_triton. It attends
    over two KV sources in a single pass: the paged prefix already in the unified pool, and
    this forward's flat extend rows not yet in the ring. Both index streams carry -1
    sentinels that must be skipped. MQA -- num_key_value_heads is 1, so each KV row is both
    K and V. attn_sink is a per-head logit with a zero value vector; it removes mass from
    the softmax denominator only. The three cases are the DeepSeek-V4-Flash attention
    compression layer classes and differ only in prefix length: c4 512 (index_topk), c128
    153, ratio-0 0 (window only). Preserve all correctness cases.
  cheatsheet: null
